<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Mistral</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #f5f5f5; }
    h1 { padding: 12px 16px; background: #1a1a2e; color: #fff; font-size: 1.1rem; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background: #7250ff; color: #fff; }
    .bot { align-self: flex-start; background: #fff; border: 1px solid #ddd; }
    form { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #ddd; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 10px 18px; background: #7250ff; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    button:disabled { background: #aaa; cursor: default; }
    .error { color: #b00020; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Chat Mistral (mistral-small-latest)</h1>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="Écrivez votre message…" autocomplete="off" />
    <button id="send" type="submit">Envoyer</button>
  </form>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    let history = [];

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      history.push({ role: "user", content: text });
      input.value = "";
      send.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erreur serveur");
        addMessage(data.reply, "bot");
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        const div = document.createElement("div");
        div.className = "msg error";
        div.textContent = "Erreur : " + err.message;
        chat.appendChild(div);
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
